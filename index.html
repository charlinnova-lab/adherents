<!-- STYLES -->
<style>
  .innova-directory-wrapper {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    margin: 20px auto;
    max-width: 1100px;
    width: 100%;
    box-sizing: border-box;
  }

  .innova-directory-wrapper * {
    box-sizing: border-box;
  }

  /* Grille des membres */
  .innova-members-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  /* Cartes individuelles (Sans ombre, sans effet au survol) */
  .innova-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: none !important;
    transform: none !important;
    transition: none !important;
  }

  .innova-card:hover {
    transform: none !important;
    box-shadow: none !important;
    border-color: #e2e8f0 !important;
  }

  .innova-card-logo {
    height: 60px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 12px;
  }

  .innova-card-logo img {
    max-height: 100%;
    max-width: 85%;
    object-fit: contain;
  }

  .innova-card-title {
    font-size: 16px;
    font-weight: 700;
    color: #2b3a82;
    margin: 4px 0 6px 0;
    line-height: 1.3;
  }

  .innova-card-description {
    font-size: 13px;
    color: #64748b;
    line-height: 1.4;
    margin: 0;
  }
</style>

<!-- STRUCTURE HTML (Nettoyée de la recherche et des filtres) -->
<div class="innova-directory-wrapper">
  <div id="membersGrid" class="innova-members-grid">
    <p style="grid-column: 1/-1; text-align: center; color: #666;">Chargement des adhérents...</p>
  </div>
</div>

<!-- SCRIPT JS (Allégé) -->
<script>
  (function() {
    const API_URL = "https://adherents.charlottepiau-innova.workers.dev/";

    function getStructureName(fields) {
      if (!fields) return "";
      const val = fields["Structure | Rasion Sociale"] 
               || fields["Structure | Raison Sociale"] 
               || fields["Structure"]
               || fields["Nom"] 
               || fields["Nom de la structure"];
      return (typeof val === "string") ? val.trim() : "";
    }

    function chargerDonnees() {
      const container = document.getElementById("membersGrid") || document.getElementById("cards-container");
      if (!container) return;

      fetch(API_URL)
        .then(res => {
          if (!res.ok) throw new Error("Erreur HTTP " + res.status);
          return res.json();
        })
        .then(data => {
          const allRecords = data.records || [];
          afficherCartes(allRecords, container);
        })
        .catch(err => {
          container.innerHTML = `<p style="color:red; grid-column: 1/-1; text-align: center;">Erreur : ${err.message}</p>`;
        });
    }

    function afficherCartes(records, container) {
      container.innerHTML = "";

      if (records.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #666;'>Aucun adhérent à afficher.</p>";
        return;
      }

      records.forEach(record => {
        const fields = record.fields || {};
        const name = getStructureName(fields);

        let logoUrl = "";
        if (Array.isArray(fields["Logo"]) && fields["Logo"].length > 0) {
          logoUrl = fields["Logo"][0].url || "";
        } else if (typeof fields["Logo"] === "string") {
          logoUrl = fields["Logo"];
        }

        const description = fields["Description"] || fields["Présentation"] || "";

        const card = document.createElement("div");
        card.className = "innova-card";
        card.innerHTML = `
          <div>
            ${logoUrl ? `<div class="innova-card-logo"><img src="${logoUrl}" alt="${name}"></div>` : ""}
            ${name ? `<h3 class="innova-card-title">${name}</h3>` : ""}
            ${description ? `<p class="innova-card-description">${description}</p>` : ""}
          </div>
        `;
        container.appendChild(card);
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", chargerDonnees);
    } else {
      chargerDonnees();
    }
  })();
</script>
